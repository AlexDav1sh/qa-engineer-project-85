    - Игрок Б успешно находит это лобби в списке и нажимает кнопку подключения — система принимает запрос без ошибок
    - После подключения Игрока Б оба игрока одновременно переходят в игровое пространство
    - В игровой комнате отображаются все необходимые элементы, и оба игрока могут взаимодействовать с редактором и тестами

- summary: |
    Проверка полноценного игрового процесса, одновременная работа двух редакторов с синхронизацией кода в реальном времени, неограниченное количество проверок, поддержка переподключения и отсутствие таймера (игра до первой сдачи)
  requirement: |
    - Игровой процесс должен обеспечивать два редактора: свой (слева) и соперника (справа). Код должен синхронизироваться в реальном времени (видно, что печатает соперник). Сверху отображается условие задачи, под ним — время игры (для статистики). 
      Кнопка «Проверить» доступна неограниченное количество раз и запускает тесты только на локальном коде. Система должна поддерживать переподключение при разрыве соединения (восстановление сессии по ID). 
      Игра не имеет таймера на победу — матч длится до первого успешного решения. Все изменения синхронизируются с использованием OT или CRDT.
  prerequisites: |
   - В системе зарегистрированы минимум 2 пользователя: Игрок A, Игрок Б
   - Оба пользователя авторизованы и находятся на главной странице
   - Установлено стабильное интернет-соединение
   - Задача загружена и отображается в верхней части экрана
   - Редакторы доступны для ввода, панель тестов активна
  test-data: |
    - Пользователь А
    - Пользователь Б
    - Созданная и настроенная игра
    - Начальное состояние, оба редактора пусты, таймер запущен с 0
  steps:
    - Оба игрока видят экран игры: сверху — условие задачи и таймер (секундомер), в центре — два редактора (слева свой, справа — редактор соперника), под редакторами — кнопка «Проверить» и область вывода тестов 
    - Игрок А начинает писать код на Python и нажимает кнопку «Проверить»
    - Одновременно Игрок Б печатает свой код на Java и нажимает кнопку «Проверить»
    - Проверяем, что кнопка «Проверить» доступна неограниченное количество раз, после каждого нажатия тесты перезапускаются, результаты обновляются только у того, кто нажал
    - Имитируем обрыв соединения у Игрока А и проверяем, что после переподключения все функции (редактирование, проверка, синхронизация) работают штатно
    - На протяжении всего процесса таймер показывает общее время с момента старта матча до финала, и не сбрасывается при переподключении
  expected-result: |
    - Оба редактора отображаются корректно: слева — свой код, справа — код соперника
    - Код синхронизируется в реальном времени: изменения, вносимые одним игроком, видны другому в его редакторе соперника
    - Кнопка «Проверить» работает неограниченное количество раз для каждого игрока независимо
    - Результаты проверки отображаются в соответствующей области под редактором каждого игрока
    - При обрыве и последующем восстановлении соединения сессия восстанавливается по ID игры, все данные сохраняются
    - Таймер корректно отсчитывает общую длительность матча, включая периоды разрыва

- summary: |
   Проверка завершения игры, отображение модального окна с победителем, блокировка проверки у победителя с появлением кнопки выхода, сохранение активности у проигравшего и удаление игры только после выхода обоих игроков
  requirement: |
   - При успешном завершении игры должно появляться модальное окно, информирующее о победителе.
     У победителя кнопка «Проверить» блокируется, появляется кнопка «Выход», при этом он может просматривать код. Проигравший может продолжать писать и проверять код, игра остаётся активной в памяти до тех пор, пока оба игрока не нажмут «Выход». 
     После выхода обоих игра полностью удаляется из активных сессий. Необходима система управления состояниями: активен , закончен, закрыт.
  prerequisites: |
   - В системе зарегистрированы минимум 2 пользователя: Игрок A, Игрок Б
   - Оба пользователя авторизованы и находятся на главной странице
   - Условие задачи отображается, оба редактора доступны для ввода
   - Игрок А уже написал правильное решение и нажал «Проверить», система определила его как победителя
   - Оба игрока ещё не вышли из игры
  test-data: |
    - Игрок А
    - Игрок Б
    - Созданная и настроенная игра
    - Пользователь А считается победившим
    - Пользователь Б проигравшим или не завершившим игру
  steps: |
    - Убедиться, что после успешной сдачи Игроком А на экране обоих игроков появляется модальное окно с сообщением о победе Игрока А и текстом, что игра завершена
    - Проверить, что у Игрока А кнопка «Проверить» стала неактивной, а вместо неё или рядом появилась кнопка «Выход»
    - У Игрока Б кнопка «Проверить» остаётся активной, он может продолжать редактировать свой код и нажимать «Проверить» — тесты запускаются, выводятся результаты, но игра уже завершена, и победитель не переопределяется.
    - Игрок Б также видит модальное окно о том, что победил Игрок А, но его собственные действия не ограничиваются.
    - Игрок А нажимает кнопку «Выход» — его сессия завершается, но игра ещё не удалена, так как Игрок Б остаётся в комнате. Проверить, что Игрок Б продолжает видеть состояние игры и статус что победил Игрок А
    - Игрок Б также нажимает «Выход». После этого игра должна быть полностью закрыта: ни один из игроков не может вернуться в неё по прямой ссылке
  expected-result: |
    - При завершении игры появляется модальное окно с корректным указанием победителя у обоих игроков.
    - У Игорока А кнопка «Проверить» блокируется, появляется кнопка «Выход», редакторы переходят в режим только для чтения, но код остаётся видимым
    - Игрок Б сохраняет возможность редактировать код и запускать проверки, но игра уже не меняет своего состояния — победитель остаётся Игроком А
    - Пока хотя бы один игрок не вышел, игра не удаляется из системы
    - После того как оба игрока нажали «Выход», игра переходит в состояние «закрыт» и полностью удаляется из активных сессий; повторный вход невозможен
    
