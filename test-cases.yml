---
- summary: |
    Проверка возможности соревновательного решения задачи на скорость с отображением кода и результатов тестов соперника, а также смены языка программирования в процессе матча
  requirement: |
    Система должна обеспечивать синхронную дуэль двух игроков, где каждый видит код и вывод тестов оппонента в реальном времени, а также позволяет сменить язык программирования без перезапуска матча и потери прогресса
  prerequisites: |
    - Два зарегистрированных пользователя, авторизованы в системе
    - Оба игрока находятся в матче
    - Выбран матч, для которого доступно минимум 2 языка программирования
  test-data: |
    - Пользователь А
    - Пользователь Б
  steps:
    - Игрок А и Игрок Б одновременно подключаются к матчу
    - Игрок А выбирает язык Python
    - Игрок Б выбирает язык Java
    - Игрок А и Б нажимают кнопку «Запустить Битву»
    - Оба игрока наблюдают за панелью соперника
    - Игрок А в процессе матча меняет язык на другой
    - Игрок Б корректирует своё решение на Java
    - Оба игрока повторно запускают тесты до тех пор, пока один из них не пройдет
    - После завершения матча проверяется итоговый экран с победителем
  expected-result: |
    - В любой момент матча каждый игрок видит код соперника в его панели
    - Смена языка программирования игроком А прошла успешно: редактор переключился на другой язык, старый код не потерян и новые тесты запустились без ошибок
    - У обоих игроков после запуска тестов решение соответствует их текущему коду
    - Победителем объявляется игрок, который первый сдал тест верно

- summary: |
    Проверка возможности начать игру тремя способами: со случайным соперником (матчмейкинг), с ботом и с другом по пригласительной ссылке
  requirement: |
    Система должна предоставлять пользователю выбор режима игры: автоматический поиск любого онлайн-игрока, игра против искусственного интеллекта (бота) или игра с конкретным другом по сгенерированной ссылке.
  prerequisites: |
    - Пользователь авторизован в системе
    - Пользователь находится на главном экране или на экране выбора режима игры
    - Для теста с матчмейкингом: в системе есть хотя бы один другой онлайн-пользователь
    - Для теста с другом: второй пользователь также авторизован и имеет доступ к полученной ссылке
    - Стабильное интернет-соединение
  test-data: |
    - Пользователь А
    - Пользователь Б
    - Генерируемая системой ссылка-приглашение
  steps:
    - Режим Режим «Игра с другом по ссылке» - Нажать "Создать битву", в Ожидании противнка скопировать ссылку - приглашение и отправить, убедиться, что оба игрока видят друг друга и могут начать решение
    - Режим «Случайный соперник» (матчмейкинг) - Нажать Присоединиться к игре и выбрать комнату с другим случайным соперником,  убедиться, что оба игрока видят друг друга и могут начать решение
    - Режим «Игра с ботом» - Нажать Присоединиться к игре и выбрать комнату с "Ботом", выбрать уровень сложности ( от 1 до 4 звезд ), убедиться, что оба игрока видят друг друга и могут начать решение
  expected-result: |
    - Во всех трёх режимах матч успешно стартует без критических ошибок
    - Интерфейс в каждой комнате соответствует стандартному виду дуэли
    - При необходимости можно прервать игру и вернуться в меню без зависаний

- summary: |
    Проверка функциональности выбора уровня сложности (от 1 до 4 звёзд) и способа выбора задачи (конкретная или случайная) при создании матча
  requirement: |
    При создании новой игры пользователь должен иметь возможность выбрать уровень сложности задачи (от 1 до 4 звёзд), после чего система должна отображать только задачи, соответствующие этому уровню. 
    Пользователь может либо выбрать конкретную задачу из отфильтрованного списка, либо активировать опцию «Случайная задача», при этом система должна подобрать случайную задачу выбранного уровня сложности. Во всех случаях выбранная задача должна корректно загружаться в игровую комнату.
  prerequisites: |
    - Пользователь авторизован в системе
    - Пользователь находится на экране настройки новой игры (создания матча), где доступны элементы управления уровнем сложности и выбором задачи
  test-data: |
    - Пользователь
    - Список задач по уровню от 1 до 4 звезд
  steps:
    - На экране создания игры выбрать уровень сложности  кликом по иконкам звёзд от 1 до 4
    - Выбрать из списка задач ( случайно или конкретную)
    - Запустить игру и убедиться, что выбралась задача в соотвествии с выбраным уровнем
  expected-result: |
    - При выборе любого уровня сложности (1–4) список доступных задач содержит только задачи с этим уровнем, ни одной задачи другого уровня не отображается
    - Выбор конкретной задачи из отфильтрованного списка и запуск игры приводит к загрузке именно этой задачи в игровую комнату (условие, тесты и название соответствуют)

- summary: |
    Проверка корректного отображения условий задач на русском и английском языках при переключении языка
  requirement: |
    Все задачи должны быть доступны на двух языках русском и английском при смене языка
  prerequisites: |
    - Пользователь авторизован в системе
    - Пользователь находится на странице создания игры
    - В системе присутствует хотя бы одна задача с полным переводом на русский и английский языки
    - Переключатель языка в настройках 
    - Установлен язык интерфейса по умолчанию русский или англиский
  test-data: |
    - Пользователь сайта
    - Любая доступная задача из списка
  steps:
    - Пользователь в настройках меняет язык ( допустим, англиский )
    - Создание новой игры, проверяем язык задач из списка
    - Меняем язык на ( русский )
    - Снова создаем игру и проверяем игру
  expected-result: |
    - При выборе русского языка весь текст задачи и интерфейса отображается на русском языке корректно, без ошибок, опечаток или смешения языков
    - При выборе английского языка весь текст задачи и интерфейса отображается на английском языке корректно

- summary: |
    Проверка возможности стороннего пользователя присоединиться к активной игре в качестве зрителя и наблюдать за ходом матча в реальном времени без возможности вмешательства
  requirement: |
    Система должна предоставлять возможность любому авторизованному пользователю подключиться к уже запущенному матчу как зритель.
  prerequisites: |
    - В системе зарегистрированы и авторизованы два игрока (А,Б), так же игрок который будет наблюдать (В)
    - Игроки A и Б находятся в активной игровой комнате
    - Зритель В находится на главной странице или на странице списка активных игр и имеет доступ к просмотру матчей
  test-data: |
    - Игрок А
    - Игрок Б
    - Зритель В
    - Активный матч и его идентефиактор 
  steps:
    - Игроки A и Б начали матч и уже находятся в игровой комнате, оба пишут код и запускают тесты
    - Зритель В находит эту активную игру через список текущих матчей и заходит, как зритель
    - После присоединения зритель В видит игровой интерфейс игроков А И Б
  expected-result: |
    - Зритель В успешно присоединяется к матчу и видит полную информацию об игре без задержек
    - Отображаются все элементы интерфейса, доступные игрокам, кроме интерактивных 
    - Код игроков обновляется в реальном времени

- summary: |
    Проверка функциональности встроенного чата для общения зарегистрированных пользователей в общем лобби
  requirement: |
    В системе должен быть встроенный чат, доступный для всех авторизованных пользователей. Чат должен позволять отправлять и получать текстовые сообщения в реальном времени
  prerequisites: |
    - В системе зарегистрированы и авторизованы два пользователя (А,Б)
    - Оба пользователя находятся в главном лобби сайта
    - Чат-виджет
  test-data: |
    - Пользователь А
    - Пользователь Б
    - Любой отправленное сообщение ( например, ПРИВЕТ! )
  steps:
    - Пользователь A открывает встроенный чат
    - Проверяет, что чат открывается, отображается поле ввода и кнопка отправки, а также область сообщений
    - Пользователь A вводит сообщение «ПРИВЕТ!» и нажимает кнопку «Отправить»
    - Пользователь А, убеждается, что сообщение появляется в области чата с его именем и временем отправки
    - Пользователь Б видит, какое сообщение написал пользователь А и его время отправки
    - Пользователь Б аналагично, отправляет сообщение и его видит пользователь А
  expected-result: |
    - Чат открывается и закрывается без ошибок; интерфейс чата интуитивно понятен
    - Сообщения отправляются и доставляются всем участникам сайта
    - У каждого сообщения указан отправитель (никнейм) и время отправки
    - Эмодзи и специальные символы отображаются корректно
    - Пустые сообщения не отправляются

- summary: |
    Проверка сохранения завершённой игры в истории с возможностью просмотра записи, где редактор кода работает как проигрыватель с управлением воспроизведением
  requirement: |
    - После завершения матча игра должна автоматически сохраняться в архиве пользователя. Запись должна включать: условие задачи, код каждого игрока в динамике, результаты прогонов тестов, тайминг, финальный результат и победителя. 
    - В режиме просмотра интерфейс редактора должен функционировать как видеоплеер: доступны кнопки воспроизведения/паузы, перемотки вперёд/назад, отображение временной шкалы 
  prerequisites: |
    - В системе зарегистрированы и авторизованы два игрока (А,Б)
    - Игроки А И Б провели между собой матч
    - Игра завершена и должна быть доступна в списке для просмотра
    - Система поддерживает запись всех действий игроков в течение матча
  test-data: |
    Тестовые данные
    Логин = ilona Пароль = password
  steps:
    - Пользователь А
    - Пользователь Б
    - После завершения найти законченный матч
    - Открыть запись и проверить запись на действительность
    - Взять временные промежутки и проверить, меняется ли код
    - Нажимает кнопку Play — запись начинает воспроизводиться. Проверяет, что в редакторах последовательно отображаются изменения кода, которые делали игроки, с соответствующей временной отметкой
    - Во время воспроизведения нажимает Pause — воспроизведение останавливается. Проверяет, что код и результаты тестов заморожены на текущем моменте
    - Перемещает ползунок таймлайна в середину записи — проверяет, что код перематывается в соответствующее состояние, и результаты тестов показываются корректно
  expected-result: |
    - Запись завершённой игры сохраняется и доступна в истории всех участников
    - Режим просмотра открывается без ошибок, интерфейс редактора становится проигрывателем с указанными элементами управления
    - Воспроизведение показывает все изменения кода каждого игрока в хронологическом порядке, синхронизируясь с временной шкалой
    - Кнопки Play/Pause и ползунок работают корректно: позволяют управлять воспроизведением, перематывать в любое время, останавливать и возобновлять
    - Состояние кода и результатов тестов на любой временной метке соответствует реальным данным, зафиксированным во время игры

- summary: |
    Проверка начисления очков пользователям по результатам игр и корректного формирования рейтингов за неделю, месяц и всё время
  requirement: |
    - Система должна начислять очки каждому игроку по итогам завершённого матча. На основе накопленных очков должны автоматически строиться рейтинговые таблицы с фильтрацией по периодам: последние 7 дней, текущий месяц и за всё время 
    - Рейтинги должны обновляться в реальном времени или с заданной периодичностью, отображать позицию пользователя, его очки и никнейм, а также позволять просматривать рейтинги другим пользователям.
  prerequisites: |
    - В системе зарегистрированы минимум 2 пользователя: Игрок A, Игрок Б
    - Все пользователи авторизованы и имеют доступ к разделу «Рейтинги»
    - Известны правила начисления очков 
    - На момент начала теста рейтинги могут быть пустыми или содержать старые данные 
  test-data: |
    - Пользователь А
    - Пользователь Б
    - Есть сыгранные игры у обоих пользователей, с полученными очками
  steps:
    - Игрок A и Б проводят матч и доводят его до завершения И кто-то побеждает. Зафиксировать время окончания матча.
    - Сразу после окончания матча Игрок A открывает раздел «Рейтинги» или свой профиль и проверяет, что его общее количество очков увеличилось согласно правилам
  expected-result: |
    - Очки начисляются корректно по окончании каждого матча в соответствии с правилами
    - Общее количество очков в профиле пользователя обновляется и совпадает с суммой очков за все его игры
    - Рейтинг «Всё время» отображает всех игроков с их суммарными очками, отсортированными по убыванию, и позиция каждого пользователя вычислена правильно
    - Рейтинг «Неделя» включает только матчи, завершённые в течение последних 7 календарных дней от текущей даты; более старые игры не учитываются
    - Рейтинг «Месяц» включает только матчи, завершённые в текущем календарном месяце; игры прошлых месяцев не учитываются

- summary: |
    Проверка создания игрового лобби, генерации кода приглашения и успешного подключения второго игрока по этому коду с последующим запуском матча
  requirement: |
    - Система должна позволять зарегистрированному пользователю создать новое игровое лобби (комнату), после чего автоматически генерируется уникальный код приглашения.
      Другой пользователь, введя этот код в соответствующем поле, должен иметь возможность присоединиться к созданному лобби.
      После подключения второго игрока оба участника должны видеть друг друга и иметь возможность начать игру, после чего они попадают в общую игровую комнату с задачей.
  prerequisites: |
    - В системе зарегистрированы минимум 2 пользователя: Игрок A, Игрок Б
    - Оба пользователя авторизованы и находятся на главной странице
    - Игрок A имеет доступ к функции «Создать битву»
    - Игрок Б имеет доступ к функции «Присоединиться к битве»
  test-data: |
    - Пользователь А
    - Пользователь Б
    - Созданная ссылка формата: https://codebattle.hexlet.io/games/322177/
  steps:
    - Игрок A нажимает кнопку «Создать битву» на главном экране и отправляет приглашение Игороку Б
    - Игрок Б переходит поссылке, что отправил Игрок 1
    - Проверить, что оба игрока переходят в игровую комнату с одинаковой задачей, редактором кода и панелями друг друга
    - Дополнительно можно проверить, что при попытке ввести неправильный код Игрок Б получает сообщение об ошибке («Неверный код приглашения») и не подключается
  expected-result: |
    - При создании игры Игроком A система генерирует уникальный код приглашения и отображает его в интерфейсе
    - Игрок Б может успешно присоединиться к лобби по этому коду
    - После подключения второго игрока начнется Битва
    - После старта оба игрока попадают в одну игровую комнату с задачей, редактором и возможностью соревноваться
    - Неправильный код приглашения не даёт подключиться, выводится сообщение об ошибке

- summary: |
    Проверка подключения второго игрока к созданной игре через список «Доступных для подключения» с переходом обоих в игровое пространство в реальном времени
  requirement: |
    -Система должна предоставлять возможность первому игроку создать лобби (игру), после чего это лобби автоматически появляется в общем списке доступных для подключения игр.
     Второй игрок должен иметь возможность найти эту игру в списке и нажать кнопку «Подключиться к Битве»
     После подключения оба игрока одновременно переносятся в игровую комнату
  prerequisites: |
    - В системе зарегистрированы минимум 2 пользователя: Игрок A, Игрок Б
    - Оба пользователя авторизованы и находятся на главной странице
    - У Игорока А есть возможность создать Игру
    - У Игорока Б есть возможность подключится к Игре
  test-data: |
    - Пользователь А
    - Пользователь Б
    - Созданная и настроенная игра
    - Сгенерированный идентификатор лобби
  steps:
    - Игрок A нажимает кнопку «Создать Биту» и настраивает параметры, затем подтверждает создание
    - Система создаёт лобби, и Игрок A попадает в режим ожидания второго игрока
    - Игрок Б на своей странице переходит в раздел «Доступные Битвы» и видит список активных лобби, где присутствует только что созданное лобби Игрока A
    - Игрок B нажимает кнопку «Подключиться к Битве» напротив этого лобби
  expected-result: |
