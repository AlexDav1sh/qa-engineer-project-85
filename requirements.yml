---
functional:
 - Решение задачи на скорость против другого игрока. Оба игрока видят редактор, код и вывод тестов соперника. Возможность менять язык программирования во время матча
 - Возможность играть с любым человеком (матчмейкинг), с ботом или с другом по ссылке
 - Выбор уровня сложности при создании игры. Возможность выбрать конкретную задачу или получить случайную
 - Условия задач доступны на русском и английском языках
 - Другие пользователи могут наблюдать за ходом игры (режим зрителя)
 - Встроенный чат для общения зарегистрированных пользователей
 - Завершённая игра сохраняется для просмотра в записи. Интерфейс редактора в режиме просмотра работает как проигрыватель
 - Пользователи получают очки за игры. На основе очков строятся рейтинги за неделю, месяц и всё время
 - Создание игры 
 - Подключение к созданной игре
 - Рабочий игровой процесс
 - Правильное заврешение игры
 - Регестрация новых пользователей
 - Авторизация уже зарегестрированных пользователей
non-functional:
 - Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
 - Сайт должен быть безопасным и защищать данные пользователя
 - Сайт должен быть удобным на мобильном устройстве
 - Сайт должен быть протестирован на совместимость с последними версиями браузеров
 - Сайт должен быть способен обрабатывать большое количество трафика (например, 1000 одновременных пользователей)
implicit:
 - Система аутенфикации и паролей, так, как общение в чате и начесление очков только у полноценно зарегестрированых пользователей
 - Механизм подбора игроков. Для режима 'игры с любым человеком' требуется сервис поиска оппонента с учетом уровня сложности и рейтинга
